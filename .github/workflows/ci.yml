name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck, test & build (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Tests use node:sqlite, available unflagged since Node 22.13
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx vite build
      # The web app keeps its data with SQLite in WebAssembly: a build without that file would start but save nothing
      - name: Web build ships SQLite (WebAssembly)
        run: ls dist/assets/sql-wasm-*.wasm

  rust:
    name: Test (Rust / Tauri)
    # macOS: the app depends on mac-notification-sys and avoids installing webkit2gtk on Linux
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # tauri::generate_context! embeds ../dist at compile time
      - run: npx vite build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
